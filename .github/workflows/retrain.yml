name: Retrain model

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'data/rafined/dataset.csv'
      - 'pipeline/**'

permissions:
  contents: write

# Un seul réentraînement à la fois : le suivant attend la fin du précédent
concurrency:
  group: retrain

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Copy .env file
        run: cp .env.example .env

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Train, evaluate and validate
        run: uv run python -m pipeline.train

      - name: Run tests with the new model
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: uv run python -m pytest

      - name: Keep evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: model-metadata
          path: models/agriculture_model_metadata.json

      - name: Publish the new model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git lfs install
          git add models/agriculture_model.joblib models/agriculture_model_metadata.json
          git commit -m "Nouveau modèle entraîné par le pipeline"
          # main a pu avancer pendant l'entraînement : on replace notre commit par-dessus
          git pull --rebase origin main
          git push

      - name: Deploy on Render
        run: curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
