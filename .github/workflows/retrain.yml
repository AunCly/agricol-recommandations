name: Retrain model

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'data/rafined/dataset.csv'
      - 'pipeline/**'

permissions:
  contents: write

# Un seul réentraînement à la fois : le suivant attend la fin du précédent
concurrency:
  group: retrain

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Copy .env file
        run: cp .env.example .env

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      # Entraînement + évaluation + validation. La décision est dans steps.train.outputs.accepted
      - name: Train, evaluate and validate
        id: train
        run: uv run python -m pipeline.train

      # Modèle refusé : on s'arrête là, en vert, sans rien publier
      - name: Model refused
        if: steps.train.outputs.accepted == 'false'
        run: echo "::notice::Modèle refusé, rien à déployer (le modèle actuel est conservé)"

      # Les steps suivants ne s'exécutent que si le modèle a été accepté
      - name: Run tests with the new model
        if: steps.train.outputs.accepted == 'true'
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: uv run python -m pytest

      - name: Publish the new model
        if: steps.train.outputs.accepted == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git lfs install
          git add models/agriculture_model.joblib models/agriculture_model_metadata.json
          git commit -m "Nouveau modèle entraîné par le pipeline"
          # main a pu avancer pendant l'entraînement : on replace notre commit par-dessus
          git pull --rebase origin main
          git push

      - name: Deploy on Render
        if: steps.train.outputs.accepted == 'true'
        run: curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
